[tool.ruff]
# Target Python 3.12
target-version = "py312"

# Line length
line-length = 120

# Exclude directories
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "htmlcov",
    ".pytest_cache",
    "build",
    "dist",
    "*.egg-info",
    ".index",
    "docs/manual/_build",
    "OBJFileLoader",  # Third-party code
    "migrations",     # Auto-generated migration files
]

[tool.ruff.lint]
# Enable rules
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "LOG",    # flake8-logging (logging misuse) — 0 app-code violations; guards new code
    "RUF012", # mutable class-attr default (shared-state-across-instances bug); app code is clean
    "S",      # flake8-bandit (security) — file-ingesting desktop app; guards new code
              # for eval/exec/pickle/unsafe-yaml/hardcoded-SQL etc. The noisy subset
              # (S101 asserts, S110/S112 defensive suppression, S311 non-crypto random)
              # is ignored below after a full triage (devlog 245); md5 fixed with
              # usedforsecurity=False; dev/build-tool subprocess is per-file-ignored.
    "DTZ",    # flake8-datetimes (naive datetime) — guards new code against tz-naive
              # datetime bugs (devlog 258). App timestamps are local wall-clock by
              # intent (filenames, display, build metadata), made explicit with
              # .astimezone(); tests and dev/build scripts are per-file-ignored.
    "C901",   # cyclomatic complexity — enforced as a *ratchet*, see
              # [tool.ruff.lint.mccabe] below.
    "PIE",    # flake8-pie — 64 violations, 62 of them a stray `pass` left behind
              # when a body gained real statements; autofixed. The 2 PIE810 sites
              # were literal-argument startswith() chains, folded into tuples.
    "RET",    # flake8-return — 58 violations, mostly `else` after `return`;
              # autofixed. RET504 is ignored below.
    "PERF",   # perflint — 21 violations. PERF102 (2) autofixed; PERF401's 19
              # append-loops were rewritten as comprehensions/extend, except four
              # in tools/search_index.py that build multi-line dicts inside nested
              # loops, where a comprehension reads worse (noqa'd in place).
    "SIM",    # flake8-simplify — 97 violations. Autofixed the mechanical ones
              # (dict.keys(), manual counters, nested with, needless bool) and
              # hand-converted the 8 defensive try/except/pass blocks to
              # contextlib.suppress, which states the intent the S110 ignore below
              # describes. SIM102/SIM108 are ignored, see below.
    "G",      # flake8-logging-format — 256 violations, 252 of them G004 (ignored
              # below). The 4 real findings were `logger.error(..., exc_info=True)`
              # in except blocks, now `logger.exception(...)`.
    "A",      # flake8-builtins — 43 violations. The 14 `int` arguments were Qt
              # slot signatures (`def cbxShow_stateChanged(self, int)`), renamed
              # to `_state`; the 17 `object` arguments became `obj` after checking
              # no call site passes them by keyword. The 12 shadowed locals were
              # renamed, except `copyright` in docs/manual/conf.py, which is the
              # name Sphinx requires (noqa'd there).
    # Phased adoption of further groups is planned in devlog R05 (measured
    # violation counts + handling per group). Add them here as each phase lands.
]

# Ignore specific rules
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module level import not at top of file (some imports need to be after sys.path manipulation)
    "N802",  # function name should be lowercase (Qt methods use camelCase)
    "N803",  # argument name should be lowercase (Qt arguments use camelCase)
    "N806",  # variable in function should be lowercase (Qt variables use camelCase)
    "N812",  # lowercase imported as non-lowercase (APP_VERSION is intentional)
    "B905",  # zip without explicit strict parameter (not available in Python 3.9)
    # flake8-bandit noise, triaged in devlog 245 (all 13 S110/S112 sites are
    # intentional best-effort suppression: error-handler cleanup, optional-feature
    # fallbacks, startup guards that must never re-raise):
    "S110",  # try-except-pass — intentional defensive suppression across the GUI
    "S112",  # try-except-continue — same, in per-item loops
    "S311",  # non-crypto random — only used for viewer color-picking/visuals; the
             # app has no cryptographic use of randomness
    # flake8-logging-format:
    "G004",    # f-string in a logging call. 252 sites — effectively the project's
               # logging style. The rule exists so the message is not formatted
               # when the level is disabled; for a desktop app logging at this
               # volume that saving is not measurable, and the lazy form
               # (`logger.info("%s failed: %s", name, e)`) is materially harder to
               # read and easy to get wrong when reordering args. G201, the rule
               # in this group that finds real mistakes, stays on.
    # flake8-simplify: the two rules whose "simplification" costs more than it
    # saves here. Ruff itself declines to autofix either at these sites, because
    # the fix would drop the comments — which is the tell.
    "SIM102",  # collapsible nested `if`. All 7 sites are layered guards where each
               # level carries its own comment explaining what it screens out
               # (drag-mode checks in table_view, GLUT availability in the 3D
               # viewer). Collapsing yields one long condition and no comments.
    "SIM108",  # if-else block instead of a ternary. The 3 remaining sites have a
               # comment inside a branch; the ternary has nowhere to put it.
    # flake8-return noise:
    "RET504",  # assign-then-return. 16 sites, 9 in application code, nearly all in
               # numeric routines (`rot_mx = np.dot(v, w); return rot_mx`,
               # `normal = normal / norm(normal); return normal`). The name is what
               # says which quantity is being returned, and keeping the binding is
               # what makes the value inspectable — MdModel has a commented-out
               # print of exactly such a variable next to the return. Inlining
               # these trades documentation for one fewer line.
]

[tool.ruff.lint.mccabe]
# Complexity ratchet. The 2026-07-24 refactoring campaign (devlog 242) brought the
# worst function from 56 down to 21, but C901 was left non-gating, so nothing
# stopped it climbing back and the CHANGELOG's "every function under 15" was never
# actually true. This pins a ceiling: the rule passes today, and no function can
# get more complex than the ones already here.
#
# Lower it as functions are split — never raise it.
#
# 19 is the application's own ceiling: MdModel::rotate_gls_to_reference_shape and
# data_exploration_dialog::on_canvas_move. The limit sat at 21 only because two
# dev tools in tools/ (not imported by the app, not shipped) were above it; both
# were split, so this number now tracks application complexity rather than being
# dragged up by tooling.
#
# 10 functions remain over 15: 7 in application code, 3 in tests/ and scripts/.
max-complexity = 19

[tool.ruff.format]
# Formatting options
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
# Import sorting
known-first-party = ["MdModel", "MdUtils", "MdStatistics", "MdHelpers", "MdConstants", "ModanController", "ModanComponents", "ModanWidgets"]
known-third-party = ["PyQt5", "peewee", "numpy", "pandas", "scipy", "matplotlib", "cv2", "PIL"]

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules for specific files
"__init__.py" = ["F401"]  # Unused imports in __init__.py are often intentional
"tests/*" = ["N802", "N803", "E712", "E722", "B017"]  # Allow non-lowercase function names, comparison to True/False, bare except, and generic exceptions in tests
"tests/**" = ["S", "DTZ"]  # bandit doesn't apply to trusted test code: asserts (S101), /tmp fixtures (S108), test SQL/subprocess/md5 fixtures
"dialogs/*" = ["N813"]  # Allow "import MdUtils as mu" convention in dialogs
"components/*" = ["N811", "N813", "B007", "B008", "E741", "N815", "F811", "F821"]  # Allow OpenGL/GLUT lowercase imports, MdUtils as mu, loop control variables, Qt naming conventions, ambiguous variables, duplicate functions, and undefined names
"build.py" = ["E402", "N813", "S603", "DTZ"]  # Allow imports after code, lowercase module imports; subprocess runs trusted build commands
"manage_version.py" = ["S603", "S607", "DTZ"]  # Dev tool: subprocess runs trusted git/python with partial paths
"docs/manual/build_all.py" = ["S602", "S603", "S607", "DTZ"]  # Dev docs-build script: trusted shell/subprocess commands
"tools/*" = ["S603", "S607", "DTZ"]  # Dev index tooling: subprocess runs trusted commands with partial paths
"scripts/*" = ["S603", "S607", "N813", "DTZ"]  # Dev benchmark/profiling scripts: same trusted-subprocess and "import MdModel as mm" conventions as tools/
"migrate.py" = ["E402", "N813", "N816", "DTZ"]  # Allow imports after code and naming conventions
"MdAppSetup.py" = ["N813"]  # Allow "import MdUtils as mu" convention
"MdHelpers.py" = ["F401", "N813"]  # Try-except dependency probes; "import MdUtils as mu" convention
"MdModel.py" = ["N813", "N816"]  # Allow "import MdUtils as mu" and gDatabase global
"MdSplashScreen.py" = ["N813"]  # Allow "import MdUtils as mu" convention
"Modan2.py" = ["N813", "F821", "F811"]  # Allow "import MdUtils as mu", undefined language variable, and duplicate functions
"ModanController.py" = ["N813"]  # Allow "import MdUtils as mu"
"ModanComponents.py" = ["N811", "N813", "B007", "B008", "B018", "E741", "N815", "F811", "F821"]  # Allow OpenGL lowercase imports, loop control, Qt naming conventions, duplicate functions, and undefined names
"setup.py" = ["B904"]  # Allow raise without from
"test_*.py" = ["N813", "F811"]  # Allow lowercase imports and class redefinitions in tests
"ModanWidgets.py" = ["N813"]  # Allow "import ModanWidgets as mw"
"objloader.py" = ["F403", "F405"]  # OpenGL star imports are standard practice

[tool.mypy]
python_version = "3.12"
# Third-party stubs are spotty for the scientific/Qt stack; don't fail on them.
ignore_missing_imports = true
# Per-module incremental adoption: check each gated module on its OWN errors,
# using imports only for type info (don't report errors in imported modules).
# Without this, `mypy MdUtils.py` reports the whole import graph's errors (e.g.
# the repo-wide matplotlib FigureCanvas / OpenGL glut stub patterns), so no
# module could be gated until the entire tree was clean.
follow_imports = "silent"
# The modules passed to mypy in CI (see .github/workflows/test.yml `mypy ...`)
# are gated — now the core root modules plus all of components/ and dialogs/.
# tests/ and build scripts remain ungated.
