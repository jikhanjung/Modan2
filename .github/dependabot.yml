version: 2
updates:
  # Enable version updates for Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # A bare login, no "@": with the "@" Dependabot could not resolve the user
    # and left an "Assignees could not be added" comment on every PR it opened
    # (#37 through #61), none of which was ever assigned. `reviewers` is gone
    # too: GitHub retired that option in favour of CODEOWNERS, and it never
    # took effect here either.
    assignees:
      - "jikhanjung"
    commit-message:
      prefix: "deps"
      include: "scope"
    # These majors are intentionally pinned out in requirements.txt: pandas 3.x
    # drops the bundled pytz metadata and breaks the frozen Windows build ("Can't
    # determine version for pytz"); numpy is held below 3.0 for the same app era.
    # Don't let Dependabot re-propose them every week (see devlog 247).
    ignore:
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]

  # Keep GitHub Actions (checkout, setup-python, cache, ...) current — actions
  # get security fixes and pinned major versions go stale otherwise.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
